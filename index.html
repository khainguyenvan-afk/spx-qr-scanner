<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>SPX Water Management · Camera V5</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff9f5,#fff0e7);color:#292524;font:15px system-ui,sans-serif}header{background:white;border-top:3px solid #ee4d2d;border-bottom:1px solid #f4c9b5;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:3}header b{font-size:30px;font-style:italic;color:#ee4d2d}header span{color:#ee4d2d;font-weight:700}main{max-width:760px;margin:auto;padding:16px 16px 115px}h1{font-size:23px;margin:0 0 5px;border-left:4px solid #ee4d2d;padding-left:10px}section{background:#fff;border:1px solid #f4c9b5;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 5px 20px #ee4d2d0b}small,.muted{color:#82736d}button,select{font:inherit;border:1px solid #f2bda5;border-radius:10px;padding:12px;background:white;color:#c63b20;cursor:pointer}button.primary{background:linear-gradient(110deg,#ff7825,#ee4d2d);color:white;border:0;font-weight:700}button:disabled{opacity:.5;cursor:default}#reader{width:100%;min-height:100px;background:#252525;border-radius:12px;overflow:hidden}#device{width:100%;margin:10px 0}.controls{display:flex;gap:8px}.controls button{flex:1}#msg{overflow-wrap:anywhere;font-size:13px}#list{padding:0;max-height:280px;overflow:auto;list-style:none}li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f4e6de;padding:8px 0;overflow-wrap:anywhere;gap:8px}li button{padding:5px 12px}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #f4c9b5;z-index:4}footer button{display:block;width:100%;max-width:728px;margin:auto}footer small{display:block;text-align:center;margin-top:6px}.count{font-size:30px;color:#ee4d2d;font-weight:800}.status{font-size:12px;color:#15803d}
</style></head><body><header><b>SPX</b><span>Water Management</span><small style="margin-left:auto">V5</small></header><main><h1 id="action"></h1><small>Quét QR liên tục · Submit một lần</small><section><small>Station thực hiện</small><p id="station" style="font-weight:700;margin:6px 0"></p><div id="target" class="muted"></div></section><section><div id="reader"></div><select id="device"><option value="">Tự động chọn camera</option></select><div class="controls"><button id="start" class="primary">Mở camera</button><button id="stop">Dừng camera</button></div><p id="msg" role="status">Chạm Mở camera để cấp quyền.</p></section><section><small>Đã quét · Chờ Submit</small><div class="count"><span id="count">0</span> bình</div><h3>Danh sách đã quét</h3><ol id="list"></ol></section></main><footer><button id="send" class="primary" disabled>Submit (0 bình)</button><small>Đồng bộ qua Apps Script · Không cần sao chép QR</small></footer><script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.hash.slice(1)),session=params.get('session'),endpoint=params.get('endpoint');let codes=[],reader=null,busy=false,running=false,audio=null;const msg=t=>$('msg').textContent=t;
function render(){ $('count').textContent=codes.length;$('send').disabled=!codes.length||!session||!endpoint;$('send').textContent='Submit ('+codes.length+' bình)';$('list').replaceChildren();codes.forEach((c,i)=>{const li=document.createElement('li'),b=document.createElement('button');li.textContent=c+' ';b.textContent='×';b.onclick=()=>{codes.splice(i,1);render()};li.append(b);$('list').append(li)});}
function add(raw){const c=String(raw).trim().toUpperCase();if(!c||c.length>256||codes.includes(c)||codes.length>=500)return;codes.push(c);render();try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.value=.1;o.frequency.value=880;o.start();o.stop(audio.currentTime+.08)}catch(e){}if(navigator.vibrate)navigator.vibrate(60);msg('Đã quét '+c)}
$('start').onclick=async()=>{if(busy||running)return;busy=true;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch(e){}try{const selected=$('device').value;const devices=await Html5Qrcode.getCameras();if(!devices.length)throw Error('Không tìm thấy camera');const choice=devices.find(d=>d.id===selected)||devices.find(d=>/back|rear|environment|sau/i.test(d.label))||devices[0];$('device').replaceChildren(...devices.map((d,i)=>new Option(d.label||('Camera '+(i+1)),d.id)));$('device').value=choice.id;reader=new Html5Qrcode('reader');await reader.start(choice.id,{fps:10,qrbox:(w,h)=>{const n=Math.floor(Math.min(w,h)*.75);return {width:n,height:n}}},add,()=>{});running=true;$('device').disabled=true;msg('Camera đang scan liên tục')}catch(e){msg('Không mở được camera: '+e);try{reader.clear()}catch(_){}reader=null}finally{busy=false}};
async function stop(){if(busy||!running)return;busy=true;try{await reader.stop();reader.clear();running=false;reader=null;$('device').disabled=false}catch(e){msg(String(e))}finally{busy=false}}$('stop').onclick=stop;
const labels={SOC_OUT:'Xuất nước về HUB',HUB_IN:'Giao nhận bình',HUB_RETURN:'Trả vỏ về SOC',SOC_RETURN_IN:'Nhận vỏ từ HUB',VENDOR_OUT:'Trả vỏ về Vendor'};
$('action').textContent=labels[params.get('action')]||'Scan QR thử nghiệm';$('station').textContent=params.get('station')||'Chưa mở phiên từ Web App';$('target').textContent=params.get('target')?'HUB nhận: '+params.get('target'):'';
try{const initial=JSON.parse(sessionStorage.getItem('cam5:'+session)||params.get('initial')||'[]');if(Array.isArray(initial))codes=[...new Set(initial.filter(c=>typeof c==='string'&&c.length<=256))].slice(0,500)}catch(e){}render();
$('send').onclick=async()=>{if(busy||!codes.length)return;let u;try{u=new URL(endpoint);if(u.origin!=='https://script.google.com'||!u.pathname.endsWith('/exec')||!/^[a-f0-9]{32}$/.test(session))throw Error('Phiên không hợp lệ')}catch(e){msg('Mở camera từ Web App để Submit');return}await stop();if(running)return;busy=true;$('send').disabled=true;msg('Đang chuyển giao dịch đến Apps Script…');const f=document.createElement('form');f.method='POST';f.action=u.href;f.target='_self';for(const [name,value] of Object.entries({session,codes:JSON.stringify(codes)})){const i=document.createElement('input');i.type='hidden';i.name=name;i.value=value;f.append(i)}document.body.append(f);try{sessionStorage.setItem('cam5:'+session,JSON.stringify(codes))}catch(e){}f.submit();};
</script></body></html>
