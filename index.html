<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SPX QR Scanner</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:16px system-ui;background:#fff6ef;color:#292524;margin:0}main{max-width:560px;margin:auto;padding:16px}h1{font-size:22px;color:#ee4d2d}section{background:white;padding:14px;border-radius:14px;margin:12px 0}button{font:inherit;border:1px solid #ee4d2d;border-radius:9px;padding:12px;background:white;color:#c63b20;margin:4px;cursor:pointer}button.primary{background:#ee4d2d;color:white}#reader{width:100%;min-height:80px}textarea{width:100%;box-sizing:border-box;min-height:100px}li{padding:5px;overflow-wrap:anywhere}#msg{overflow-wrap:anywhere}</style></head><body><main><h1>SPX · Scan QR liên tục</h1><section><div id="reader"></div><button id="start" class="primary">Mở camera</button><button id="stop">Dừng camera</button><p id="msg" role="status">Chạm Mở camera để cấp quyền.</p></section><section><h2>Đã quét: <span id="count">0</span></h2><ol id="list"></ol><button id="send" class="primary">Hoàn tất scan</button><button id="copy">Sao chép danh sách QR</button><textarea id="output" readonly placeholder="Danh sách QR để sao chép nếu không tự chuyển về Web App"></textarea></section></main><script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.hash.slice(1)),token=params.get('token'),origin=params.get('origin');let codes=[],reader=null,busy=false,running=false,audio=null;const msg=t=>$('msg').textContent=t;
function render(){ $('count').textContent=codes.length;$('output').value=codes.join('\n');$('list').replaceChildren();codes.forEach((c,i)=>{const li=document.createElement('li'),b=document.createElement('button');li.textContent=c+' ';b.textContent='×';b.onclick=()=>{codes.splice(i,1);render()};li.append(b);$('list').append(li)});}
function add(raw){const c=String(raw).trim().toUpperCase();if(!c||c.length>256||codes.includes(c)||codes.length>=500)return;codes.push(c);render();try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.value=.1;o.frequency.value=880;o.start();o.stop(audio.currentTime+.08)}catch(e){}if(navigator.vibrate)navigator.vibrate(60);msg('Đã quét '+c)}
$('start').onclick=async()=>{if(busy||running)return;busy=true;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch(e){}try{reader=new Html5Qrcode('reader');await reader.start({facingMode:{ideal:'environment'}},{fps:10,qrbox:(w,h)=>{const n=Math.floor(Math.min(w,h)*.75);return {width:n,height:n}}},add,()=>{});running=true;msg('Camera đang scan liên tục')}catch(e){msg('Không mở được camera: '+e);try{reader.clear()}catch(_){}reader=null}finally{busy=false}};
async function stop(){if(busy||!running)return;busy=true;try{await reader.stop();reader.clear();running=false;reader=null}catch(e){msg(String(e))}finally{busy=false}}$('stop').onclick=stop;
$('send').onclick=async()=>{if(busy||!codes.length)return;await stop();if(running)return;try{if(!window.opener||!token||!origin||new URL(origin).protocol!=='https:')throw Error();window.opener.postMessage({type:'SPX_QR_BATCH_V2',token,codes},origin);msg('Đang chuyển QR. Nếu không tự đóng, sao chép danh sách và dán vào Web App.')}catch(e){msg('Không kết nối được Web App. Sao chép danh sách QR rồi dán vào Web App.')}};
window.addEventListener('message',e=>{if(e.source===window.opener&&e.origin===origin&&e.data?.type==='SPX_QR_ACK_V2'&&e.data.token===token){msg('Đã chuyển danh sách về Web App');window.close()}});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(codes.join('\n'));msg('Đã sao chép. Quay lại Web App và chọn Dán danh sách QR.')}catch(e){$('output').focus();$('output').select();msg('Hãy sao chép thủ công từ ô danh sách.')}};
</script></body></html>
